name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "1"
      RAI_TEST_PG_ADMIN_URL: postgresql+psycopg://postgres@127.0.0.1:54329/postgres
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: PgBouncer (för testet av RLS-kontext i transaktionsläge)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pgbouncer
      - name: Installera
        run: pip install -e ".[ai,worker,dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Typkontroll (kärnmoduler)
        run: mypy
      - name: Tester
        run: pytest -q
      - name: AI-evals (utan modell – regelbaserad reserv)
        run: redovisningai eval
      - name: Fas 0-CLI på demodata
        run: |
          redovisningai demo-sie --out /tmp/demo
          redovisningai analyze /tmp/demo/*Bygg*.se --out /tmp/rapport
          ls -la /tmp/rapport

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Bygg avbilder
        run: |
          docker build -t redovisningai-api services/api
          docker build -t redovisningai-web apps/web
      - name: Validera docker-compose
        run: |
          cp .env.example .env
          docker compose config -q
