# Regelkatalog. Varje regel har lagstöd, giltighet, ägare och standardparametrar.
# Byråer kan justera parametrar (trösklar, kontolistor) – aldrig lagstöd eller giltighet.
# Ändringar här ska granskas av domänexpert och ge ny version.
