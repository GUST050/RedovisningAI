[project]
name = "redovisningai"
version = "0.1.0"
description = "Granskningsverktyg för redovisningsbyråer: SIE-import, ekonomimotor, svenska kontroller, ärenden, kundminne och AI-stöd."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "pyjwt[crypto]>=2.8",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ai = ["anthropic[bedrock,vertex]>=1.8"]
s3 = ["boto3>=1.34"]
worker = ["procrastinate>=3.0"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
redovisningai = "redovisningai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redovisningai"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501", "SIM108", "SIM102"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["redovisningai.sie", "redovisningai.domain", "redovisningai.accounting", "redovisningai.rules", "redovisningai.facts"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
